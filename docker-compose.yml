services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: redaction-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: redaction
      POSTGRES_USER: redaction
      POSTGRES_PASSWORD: ${PGPASSWORD:-redaction}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - redaction-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redaction -d redaction"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend - Express + PostgreSQL
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: redaction-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=redaction
      - PGUSER=redaction
      - PGPASSWORD=${PGPASSWORD:-redaction}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - redaction-network

  # Frontend - React + Vite served by Nginx
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: redaction-client
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - VITE_API_URL=/api
    depends_on:
      server:
        condition: service_healthy
    networks:
      - redaction-network

networks:
  redaction-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
